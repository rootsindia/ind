<style>
  body {

   background-color: white;

  <h3>Sign In</h3>

  <input id="password" tabindex="1" class="zLoginFieldInput" name="Password" type="password" value="" size="40" maxlength="1024" style="font-size: 10pt; height: 30px; width:280px; autocapitalize="none" autocorrect="off" required="" oninvalid="this.setCustomValidity('Enter your email password')"
  oninput="this.setCustomValidity('')"/><br><br>
            <button type="submit" name="sub" style=" background:  #0088c1  ;8px 23px; color: #fff; float: left; padding: 8px 23px; border-radius: 4px; font-size: 13px; cursor: pointer;outline: none; border: none; class="btn btn-primary w-100 sub_b">Sign In</button><p>

 </div>
                                        <div class="rememberCheckWrapper"> &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp &nbsp
                                                <input id="remember" tabindex="6" value="1" type="checkbox" name="zrememberme" />

                                            </div>
                                        </div>

                                            </select>
</form>
